<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0B111A">
  <title>Bảng Điều Khiển - My AdBlocker</title>
  <link rel="stylesheet" href="popup/popup.css">
  <style>
    /* Dashboard Specific Enhancements */
    .dashboard-wrapper {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: clamp(14px, 3vw, 36px);
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 2.5vw, 28px);
    }
    /* Top Navigation Bar */
    .dashboard-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-brand-title {
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 700;
      color: var(--text-high);
      text-wrap: balance;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hamburger-btn {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      color: var(--text-high);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    /* Grid Layout: 2 Columns on Tablet & Desktop */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 360px 1fr;
        align-items: start;
      }
    }
    /* Responsive Data Table for Domain Rules */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      margin-top: 12px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    .data-table th, .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .data-table th {
      background: var(--bg-surface-elevated);
      color: var(--text-mid);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.5px;
    }
    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .domain-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
    }
    .domain-badge.whitelist {
      background: var(--emerald-dim);
      color: var(--emerald-primary);
      border: 1px solid rgba(0, 229, 163, 0.3);
    }
    .domain-badge.blocked {
      background: var(--paused-dim);
      color: var(--paused-primary);
      border: 1px solid rgba(255, 90, 90, 0.3);
    }
    @media (max-width: 600px) {
      .data-table, .data-table tbody, .data-table tr, .data-table td {
        display: block;
        width: 100%;
      }
      .data-table thead { display: none; }
      .data-table tr { margin-bottom: 10px; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 8px; }
      .data-table td { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); }
      .data-table td:last-child { border-bottom: none; }
      .data-table td::before { content: attr(data-label); font-weight: 600; color: var(--text-dim); font-size: 10.5px; }
      .hamburger-btn { display: inline-flex; }
      .nav-links { display: none; }
      .nav-links.is-open { display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-surface-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 14px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">
    <!-- Navigation Header -->
    <header class="dashboard-nav">
      <div class="nav-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="nav-brand-title">My AdBlocker Dashboard</span>
      </div>
      <nav class="nav-links" id="dashNavLinks">
        <button class="hamburger-btn" id="dashMenuBtn" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <!-- Additional nav links could be added here -->
      </nav>
    </header>
    <!-- Main Content Grid -->
    <div class="dashboard-grid">
      <!-- Left Panel: Stats -->
      <section class="stats-panel">
        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-label">Tổng tích luỹ</span>
            <svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </div>
          <div class="stat-number" id="dashTotalCount" aria-live="polite">0</div>
          <div class="stat-caption"><span id="dashTrackersCount">0</span> trackers đã chặn</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-label">Trình theo dõi</span>
            <svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2a10 10 0 0 0-9.95 9.2"/></svg>
          </div>
          <div class="stat-number" id="dashTrackersCount" aria-live="polite">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-label">Quảng cáo</span>
            <svg class="stat-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg>
          </div>
          <div class="stat-number" id="dashAdsCount" aria-live="polite">0</div>
        </div>
      </section>
      <!-- Right Panel: Domain Table -->
      <section class="domains-panel">
        <div class="table-container">
          <table class="data-table" id="dashTable">
            <thead>
              <tr>
                <th data-label="Tên miền">Tên miền</th>
                <th data-label="Phân loại">Phân loại</th>
                <th data-label="Hành động">Hành động</th>
                <th data-label="Thao tác">Thao tác</th>
              </tr>
            </thead>
            <tbody id="dashTableBody"></tbody>
          </table>
          <div class="empty-state" id="dashEmptyState" style="display:none;">Không có tên miền nào.</div>
        </div>
        <div class="domain-input-section">
          <input type="text" id="dashDomainInput" placeholder="Nhập tên miền (vd: example.com)…" aria-label="Tên miền">
          <button id="dashAddDomainBtn" type="button">Thêm</button>
          <div class="error" id="dashDomainError" style="display:none;" role="alert"></div>
        </div>
      </section>
    </div>
  </div>
  <!-- Load shared API before dashboard script -->
  <script src="shared/api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
